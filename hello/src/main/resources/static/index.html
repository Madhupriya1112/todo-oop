<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Todo List</h1>
        
        <div class="input-section">
            <input type="text" id="todoTitle" placeholder="Enter todo title">
            <input type="text" id="todoDescription" placeholder="Enter description">
            <button onclick="addTodo()">Add Todo</button>
        </div>

        <div class="actions">
            <button onclick="clearAll()" class="clear-btn">Clear All</button>
            <button onclick="loadTodos()" class="refresh-btn">Refresh</button>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Todos will be loaded here -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
